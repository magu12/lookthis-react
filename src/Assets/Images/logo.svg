<svg width="40" height="30" xmlns="http://www.w3.org/2000/svg">
  <!-- Анимации -->
  <defs>
    <animateTransform
      id="moveLeft"
      attributeName="transform"
      type="translate"
      dur="1s"
      values="0,0; -4,0; 0,0"
      begin="0s;moveScale.end"
      fill="freeze"/>
    
    <animateTransform
      id="moveRight"
      attributeName="transform"
      type="translate"
      dur="1s"
      values="0,0; 4,0; 0,0"
      begin="moveLeft.end"
      fill="freeze"/>
    
    <animate
      id="scaleUp"
      attributeName="r"
      values="5;7;5"
      dur="1s"
      begin="moveRight.end"
      fill="freeze"/>
    
    <animate
      id="moveScale"
      attributeName="r"
      values="5;3;5"
      dur="1s"
      begin="scaleUp.end"
      fill="freeze"/>
  </defs>

  <!-- Минималистичный символ иллюминатов -->
  <g transform="translate(20, 20) scale(0.3)">
    <!-- Треугольник -->
    <path d="M0,-60 L52,30 L-52,30 Z" 
          fill="none" 
          stroke="#5C4033" 
          stroke-width="4"/>
    
    <!-- Заострённый глаз (уже на 20%) -->
    <path d="M-25,0 Q-16,-15 0,-15 Q16,-15 25,0 Q16,15 0,15 Q-16,15 -20,0"
          fill="none"
          stroke="#5C4033"
          stroke-width="4"/>
    
    <!-- Реснички -->
    <g stroke="#5C4033" stroke-width="2">
      <!-- Верхние реснички -->
      <line x1="-16" y1="-10" x2="-19" y2="-18"/>
      <line x1="-8" y1="-13" x2="-9" y2="-21"/>
      <line x1="0" y1="-14" x2="0" y2="-22"/>
      <line x1="8" y1="-13" x2="9" y2="-21"/>
      <line x1="16" y1="-10" x2="19" y2="-18"/>
      
      <!-- Нижние реснички -->
      <line x1="-16" y1="10" x2="-19" y2="16"/>
      <line x1="-8" y1="13" x2="-9" y2="19"/>
      <line x1="0" y1="14" x2="0" y2="20"/>
      <line x1="8" y1="13" x2="9" y2="19"/>
      <line x1="16" y1="10" x2="19" y2="16"/>
    </g>
    
    <!-- Зрачок с анимацией (немного уменьшен) -->
    <circle cx="0" cy="0" r="5" 
            fill="#5C4033">
      <!-- Применяем все анимации к зрачку -->
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="1s"
        values="0,0; -4,0; 0,0"
        begin="0s;moveScale.end"
        fill="freeze"/>
      
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="1s"
        values="0,0; 4,0; 0,0"
        begin="moveLeft.end"
        fill="freeze"/>
      
      <animate
        attributeName="r"
        values="5;7;5"
        dur="1s"
        begin="moveRight.end"
        fill="freeze"/>
      
      <animate
        attributeName="r"
        values="5;3;5"
        dur="1s"
        begin="scaleUp.end"
        fill="freeze"/>
    </circle>
  </g>
</svg>